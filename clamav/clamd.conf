# ClamAV daemon configuration for DMARCo.
# The processor connects to the daemon over TCP and streams message
# attachments to it before anything is uploaded or forwarded.

LogTime yes
User clamav

LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0

StreamMaxLength 25M
MaxScanSize 100M
MaxRecursion 10
MaxFiles 100

HeuristicScanPrecedence yes
AlertEncrypted yes
