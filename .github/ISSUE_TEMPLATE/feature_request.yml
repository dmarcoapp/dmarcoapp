name: Feature request
description: Suggest something DMARCo should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem you ran into, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working, if you have something specific in mind.

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
