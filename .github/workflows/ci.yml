name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate the stack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create example configuration
        run: |
          cp .env.example .env
          sed -i 's/=generated/=ci-placeholder-value/' .env
          mkdir -p secrets
          for secret in webhook_secret s3_access_key s3_secret_key cloudflare_token; do
            printf 'ci-placeholder\n' > "secrets/${secret}.txt"
          done

      - name: Validate Compose config
        run: docker compose config --quiet

      - name: Validate Compose config with the letsencrypt profile
        run: COMPOSE_PROFILES=letsencrypt docker compose config --quiet

      - name: Validate the Caddy configuration
        run: |
          docker run --rm \
            -e ACME_EMAIL=ci@example.com \
            -e APP_DOMAIN=dmarc.example.com \
            -v "${PWD}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Check the installer
        run: |
          bash -n install.sh
          if ! command -v shellcheck > /dev/null; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck install.sh
